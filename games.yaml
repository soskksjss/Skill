# Hindi Gaming Clipping Agent v3.0 - Per-Game Keywords & Triggers

games:
  gta6:
    display_name: "GTA 6"
    keywords:
      - "liberty city"
      - "vice city"
      - "heist"
      - "mission"
      - "wasted"
      - "busted"
      - "police"
      - "car"
      - "crew"
      - "leon"
      - "jason"
      - "get"
    triggers:
      - pattern: "heist"
        type: "story"
        bonus: 1.0
      - pattern: "wasted"
        type: "funny"
        bonus: 0.5
      - pattern: "busted"
        type: "funny"
        bonus: 0.5
      - pattern: "police"
        type: "rage"
        bonus: 0.5
      - pattern: "mission fail"
        type: "funny"
        bonus: 0.5
    extra_hashtags:
      - "#gta6"
      - "#gtav"
      - "#gta6clips"

