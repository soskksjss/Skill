# Hindi Gaming Clipping Agent v3.0 - Configuration

video:
  resolution:
    width: 2160
    height: 3840
  aspect_ratio: "9:16"
  fps: 30
  codec: "h264"          # h264 or h265
  crf: 16
  pixel_format: "yuv420p"
  profile: "high"
  preset: "medium"
  upscale_algorithm: "lanczos"
  max_file_size_mb: 120
  facecam_crop: "center" # center crop removes corner facecams
  kill_zoom_factor: 1.15
  kill_zoom_transition_sec: 0.5
  freeze_frame_sec: 0.5

audio:
  target_lufs: -14.0
  true_peak_db: -1.5
  lra: 11.0
  sample_rate: 48000
  bitrate: "320k"
  sfx_relative_db: -18.0
  bgm_db: -20.0
  bgm_duck_db: -6.0
  bgm_fade_in_sec: 1.0
  bgm_fade_out_sec: 1.5
  bgm_styles:
    - "phonk"
    - "lofi"
    - "dark_ambient"
  keep_raw_events:
    - "kill"
    - "scream"
    - "laughter"
    - "clutch"
    - "rage"
    - "funny"

captions:
  font_name: "Poppins Bold"
  fallback_font: "Montserrat Bold"
  size_px: 52
  color: "#FFFFFF"
  stroke_color: "#000000"
  stroke_width: 4
  position_from_top_pct: 65
  max_words_per_line: 4
  fade_in_ms: 60
  fade_out_ms: 40
  highlight_color: "#FFD700"
  highlight_keywords:
    - "CLUTCH"
    - "HEADSHOT"
    - "1V5"
    - "1V4"
    - "ACE"
    - "NO-SCOPE"
    - "SCENE SET"
    - "WASTED"
    - "BOOYAH"
    - "CHICKEN DINNER"
    - "GG"
    - "ONE-TAP"

hook:
  duration_sec: 1.5
  font_name: "Impact"
  size_px: 72
  color: "#FFFFFF"
  stroke_color: "#FF0000"
  stroke_width: 5
  position_from_top_pct: 25
  animation: "slide_down"

end_card:
  duration_sec: 2.0
  font_name: "Poppins Bold"
  size_px: 36
  color: "#FFFFFF"
  stroke_color: "#000000"
  stroke_width: 3
  credit_template: "Clip from {streamer}'s stream"
  cta_text: "Follow for daily clips"

cutting:
  bad_start_words:
    - "toh"
    - "aur"
    - "phir"
    - "तो"
    - "और"
    - "फिर"
  bad_end_phrases:
    - "aur phir"
    - "और फिर"
    - "toh phir"
  filler_words:
    - "yaar"
    - "um"
    - "uh"
    - "matlab"
    - "haan haan"
    - "kya kya"
    - "sorry bhai"
    - "mujhe lagta hai"
    - "यार"
    - "मतलब"
    - "हाँ हाँ"
    - "क्या क्या"
  max_pause_sec: 2.0
  tension_pause_sec: 1.0
  crossfade_ms: 50
  speed_ups:
    walking: 1.25
    loading: 1.5
    zone_waiting: 1.5

detection:
  window_sec: 30.0
  overlap_sec: 15.0
  min_score: 7.0
  banger_score: 9.0
  weights:
    emotional_spike: 0.25
    unexpectedness: 0.20
    completeness: 0.15
    visual_appeal: 0.10
    shareability: 0.10
    hook_strength: 0.10
    trending_fit: 0.10
  bonuses:
    scream: 1.0
    laugh: 0.5
    kill_sfx: 0.5
    clutch_1v5_ace: 1.0
    no_scope: 0.5
  penalties:
    five_plus_fillers: -1.0
    dead_air_3s: -1.0
    mid_sentence_start: -0.5
    ends_aur_phir: -0.5

batch_balance:
  min_gap_between_clips_sec: 300
  max_consecutive_same_type: 2
  require_banger: true
  first_clip_highest_score: true
  last_clip_funniest: true
  target_ratios:
    clutch: 0.25
    funny: 0.25
    rage: 0.17
    skill: 0.17
    story: 0.08

platforms:
  youtube_shorts:
    max_duration_sec: 60
    ideal_min_sec: 25
    ideal_max_sec: 45
    max_title_chars: 50
    hashtags_count: 3
    base_hashtags:
      - "#gaming"
      - "#higaming"
      - "#shorts"
    seamless_loop: true
    best_post_time_ist: "19:30 IST"
  instagram_reels:
    max_duration_sec: 90
    ideal_min_sec: 30
    ideal_max_sec: 60
    hashtags_count: 5
    base_hashtags:
      - "#gaming"
      - "#higaming"
      - "#hindigaming"
      - "#reels"
    end_card_required: true
    best_post_time_ist: "20:00 IST"
  tiktok:
    max_duration_sec: 60
    ideal_min_sec: 20
    ideal_max_sec: 45
    hashtags_count: 4
    base_hashtags:
      - "#gaming"
      - "#gamingclips"
      - "#fyp"
    best_post_time_ist: "20:30 IST"
